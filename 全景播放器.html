<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全景播放器</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 提示与控制条 */
  #hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    color: #ddd; font: 14px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: rgba(0,0,0,.45); padding: 8px 14px; border-radius: 999px;
    backdrop-filter: blur(6px); pointer-events: none; user-select: none;
    transition: opacity .6s ease;
  }
  #hint.fade { opacity: 0; }

  #bar {
    position: fixed; top: 16px; left: 16px; display: flex; gap: 8px; align-items: center;
    font: 13px/1 -apple-system, "PingFang SC", sans-serif; color: #eee;
  }
  .btn {
    cursor: pointer; padding: 8px 14px; border-radius: 8px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    color: #eee; backdrop-filter: blur(6px); transition: background .2s;
  }
  .btn:hover { background: rgba(255,255,255,.22); }
  #status { opacity: .8; }

  /* 载入遮罩 */
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; color: #aaa; font: 15px/1.4 sans-serif; z-index: 10;
    flex-direction: column; gap: 12px;
  }
  #loading.hide { display: none; }
  .spin {
    width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.2);
    border-top-color: #fff; border-radius: 50%; animation: sp 1s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>

<div id="bar">
  <label class="btn" for="file">打开图片</label>
  <input id="file" type="file" accept="image/*" style="display:none" />
  <span id="status">等距柱状投影 · 球内视角</span>
</div>

<div id="hint">拖动旋转视角 · 滚轮缩放</div>

<div id="loading">
  <div class="spin"></div>
  <div>正在加载全景…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- 场景 / 相机 / 渲染器 ----------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 1100
);
camera.position.set(0, 0, 0); // 相机在球心

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

// ---------- 全景球（贴在球内表面） ----------
const RADIUS = 500;
const sphere = new THREE.SphereGeometry(RADIUS, 64, 64);
// 翻转法线 / 用 BackSide，使我们从内部能看到贴图
const material = new THREE.MeshBasicMaterial({
  side: THREE.BackSide,
});
const mesh = new THREE.Mesh(sphere, material);
scene.add(mesh);

// ---------- 纹理载入 ----------
const loader = new THREE.TextureLoader();
const loadingEl = document.getElementById('loading');
const statusEl  = document.getElementById('status');

function loadTexture(url, label) {
  loadingEl.classList.remove('hide');
  loader.load(
    url,
    (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      // 等距柱状投影贴在球内表面时左右会镜像，翻转 U 方向纠正
      tex.wrapS = THREE.RepeatWrapping;
      tex.repeat.x = -1;
      tex.offset.x = 1;
      material.map = tex;
      material.needsUpdate = true;
      loadingEl.classList.add('hide');
      if (label) statusEl.textContent = label;
    },
    undefined,
    (err) => {
      loadingEl.querySelector('div:last-child').textContent = '载入失败，请点击“打开图片”选择本地全景图';
      console.error(err);
    }
  );
}

// 默认示例图（Three.js 官方 equirectangular 样例）。可离线时用下方文件选择器换图。
loadTexture(
  'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg',
  '示例全景 · 球内视角'
);

// 本地图片载入
document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  loadTexture(URL.createObjectURL(f), f.name);
});

// ---------- 视角控制：拖动旋转 + 滚轮缩放（改 FOV） ----------
// 用球面坐标管理相机朝向，避免 OrbitControls 围绕目标旋转的设定
let lon = 0, lat = 0;          // 经度 / 纬度（度）
let isDown = false;
let lastX = 0, lastY = 0;
const dom = renderer.domElement;

dom.addEventListener('pointerdown', (e) => {
  isDown = true; lastX = e.clientX; lastY = e.clientY;
  dom.setPointerCapture(e.pointerId);
  hideHint();
});
dom.addEventListener('pointermove', (e) => {
  if (!isDown) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  lon -= dx * 0.12;            // 水平拖动 → 经度
  lat += dy * 0.12;            // 垂直拖动 → 纬度
  lat = Math.max(-85, Math.min(85, lat)); // 限制到极点附近，避免翻转
});
dom.addEventListener('pointerup',   (e) => { isDown = false; });
dom.addEventListener('pointercancel',() => { isDown = false; });

dom.addEventListener('wheel', (e) => {
  e.preventDefault();
  camera.fov = Math.max(10, Math.min(100, camera.fov + e.deltaY * 0.05));
  camera.updateProjectionMatrix();
}, { passive: false });

// 触屏捏合缩放
let pinchDist = 0;
dom.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });
dom.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (pinchDist) {
      const ratio = pinchDist / d;
      camera.fov = Math.max(10, Math.min(100, camera.fov * ratio));
      camera.updateProjectionMatrix();
    }
    pinchDist = d;
  }
}, { passive: true });

// 提示自动淡出
const hintEl = document.getElementById('hint');
let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  hintEl.classList.add('fade');
}
setTimeout(hideHint, 4000);

// ---------- 渲染循环 ----------
function animate() {
  requestAnimationFrame(animate);
  // 把经纬度转成相机朝向
  const phi   = THREE.MathUtils.degToRad(90 - lat); // 极角
  const theta = THREE.MathUtils.degToRad(lon);      // 方位角
  const target = new THREE.Vector3(
    500 * Math.sin(phi) * Math.cos(theta),
    500 * Math.cos(phi),
    500 * Math.sin(phi) * Math.sin(theta)
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
}
animate();

// ---------- 自适应窗口 ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
